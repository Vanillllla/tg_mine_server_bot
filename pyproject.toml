[project]
name = "minecraft-web-panel"
version = "0.1.0"
description = "Web panel backend scaffold for Minecraft Server Instances"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "psutil>=5.9,<8.0",
    "aiofiles>=23.2,<26.0",
    "python-multipart>=0.0.9,<1.0",
    "aiogram>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
